[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forwardguard"
version = "0.1.0"
description = "Continuous audit tooling for silent email-forwarder detection in domain registrars and shared-hosting cPanel environments"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Divolt Security Research", email = "research@divoltbtc.com" }]
maintainers = [{ name = "Divolt Security Research", email = "research@divoltbtc.com" }]
keywords = ["email", "security", "forwarding", "cpanel", "dns", "registrar", "audit", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "dnspython>=2.6",
    "aiosmtplib>=3.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
forwardguard = "forwardguard.cli:app"

[project.urls]
Homepage      = "https://github.com/divolt-security-research/forwardguard"
Documentation = "https://github.com/divolt-security-research/forwardguard#readme"
Repository    = "https://github.com/divolt-security-research/forwardguard"
Issues        = "https://github.com/divolt-security-research/forwardguard/issues"
Paper         = "https://arxiv.org/"
Standard      = "https://github.com/divolt-research/smfps"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "S"]
ignore = [
    # Blanket-except is intentional in background polling loops; one bad
    # message must not crash the pipeline. Pair with the structured alert
    # on parse errors.
    "BLE001",
    # typer idiom: argument defaults use typer.Option(...)
    "B008",
    # Short try/except/continue inside a tight parse loop; the alt is a
    # noisier log line per bad input which is actively unhelpful.
    "S112",
    # list(set) is clearer than relying on sorted-of-set in a few places
    "C414",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert-based tests are the point in pytest
